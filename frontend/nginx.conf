server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same relative shape as vite.config.js's dev proxy, so the frontend code
    # (relative "/api" baseURL in src/api/client.js) needs no change in prod.
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
    }

    # SPA client-side routing (react-router) — unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
